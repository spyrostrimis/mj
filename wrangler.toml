# Cloudflare Pages configuration.
#
# database_id is filled in after you run:
#   npx wrangler d1 create mj-journal
# Copy the printed database_id below, then commit this file.

name = "mj"
compatibility_date = "2026-09-01"
pages_build_output_dir = "public"

# TEMPORARY, while the app is still being built. "1" opens the journal: the
# /api/* guard lets every request through and the app never shows the lock
# screen. Anything other than the exact string "1" leaves the gate on, so
# deleting this block - or any typo in it - restores the password.
# Remove it before there is anything real in the journal.
[vars]
AUTH_DISABLED = "1"

[[d1_databases]]
binding = "DB"
database_name = "mj-journal"
database_id = "16bc42fb-9b81-4364-a9f8-f22779f7a24a"
migrations_dir = "migrations"
